<header class="topbar">
  <button id="menu-toggle" class="menu-toggle icon-btn" aria-label="Open menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
    </svg>
  </button>
  <div class="topbar-search">
    <form id="search-form" action="{{ '/search/' | relative_url }}" method="get" role="search">
      <div class="search-input-wrap">
        <input id="search-input" name="q" type="search" placeholder="Search..." autocomplete="off">
        <button id="search-clear" type="button" aria-label="Clear search" title="Clear">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </button>
      </div>
      <button id="search-submit" type="submit" aria-label="Search" title="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <path d="M20 20l-4.2-4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </button>
    </form>
    <div id="search-results" class="search-results"></div>
  </div>
</header>
