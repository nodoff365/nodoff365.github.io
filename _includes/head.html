<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign page_title = page.title | default: site.title %}
{% assign page_desc = page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 %}
{% assign canonical_url = page.url | replace: 'index.html', '' | absolute_url %}

<title>{{ page_title }} | {{ site.title }}</title>
<meta name="description" content="{{ page_desc }}">
<meta name="theme-color" content="{{ site.theme_color }}">
<link rel="canonical" href="{{ canonical_url }}">

<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_desc }}">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:site_name" content="{{ site.title }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_title }}">
<meta name="twitter:description" content="{{ page_desc }}">

<link rel="alternate" type="application/atom+xml" title="{{ site.title }} RSS" href="https://nodoff365.github.io/feed.xml">
<link rel="sitemap" type="application/xml" title="Sitemap" href="https://nodoff365.github.io/sitemap.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (!t) {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (_) {}
  })();
</script>

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script data-goatcounter="{{ site.goatcounter.script }}" async src="https://gc.zgo.at/count.js"></script>
