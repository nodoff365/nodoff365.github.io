title: Notes by nodoff                                    # 사이트 제목 (상단 브랜드 / 브라우저 탭에 표시)
description: "클라우드 · 인프라 · 보안을 공부하고 기록합니다"  # 사이트 한 줄 소개
baseurl: ""            # (시스템) 하위 경로. 루트 배포이므로 비움 — 건드리지 마세요.
url: "https://nodoff365.github.io"   # (시스템) 사이트 주소 — 건드리지 마세요.
markdown: kramdown     # (시스템) 마크다운 엔진
timezone: Asia/Seoul   # 시간대 (글 날짜 표시 기준)
paginate: 5            # 글 목록(/posts) 한 페이지에 보여줄 글 수
paginate_path: "/page:num/"          # (시스템) 페이지네이션 URL 형식
permalink: /:categories/:title/      # (시스템) 글 주소 형식

kramdown:              # (시스템) 마크다운 세부 설정 — 건드리지 마세요.
  input: GFM
highlighter: rouge     # (시스템) 코드 하이라이터

plugins:               # (시스템) Jekyll 플러그인 — 건드리지 마세요.
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

author:
  name: nodoff365      # 글쓴이 이름

github_username: nodoff365                    # (시스템) GitHub 계정
repository: nodoff365/nodoff365.github.io      # (시스템) 리포지토리
theme_color: "#111111"                         # 모바일 브라우저 상단 바 색

goatcounter:           # (시스템) 조회수 카운터 연동 — 건드리지 마세요.
  script: "https://nodoff365.goatcounter.com/count"
  api: "https://nodoff365.goatcounter.com/counter/"

giscus:                # (시스템) 댓글 연동. 아래 theme 두 줄만 바꿔도 됩니다.
  repo: "nodoff365/nodoff365.github.io"
  repo_id: "R_kgDORQ5KlQ"
  category: "Comments"
  category_id: "DIC_kwDORQ5Klc4C24F_"
  mapping: "pathname"
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "1"
  input_position: "top"
  lang: "en"
  theme_light: "light"              # ← 라이트 모드 댓글 테마 (수정 가능)
  theme_dark: "transparent_dark"    # ← 다크 모드 댓글 테마 (수정 가능)

home:
  # ── Posts 피드 글 정렬 (날짜 기준) ──
  #   desc = 최신 글이 위 (기본)  |  asc = 오래된 글이 위
  post_sort: "desc"

  # ── Posts 필터 칩 정렬 ──
  #   asc  = 영문(A→Z) 먼저, 그다음 한글(ㄱ→ㅎ)   |   desc = 그 반대
  #   ※ 정확히는 영문 대문자(A–Z) → 영문 소문자(a–z) → 한글(가–힣) 순.
  #   ※ "전체" 칩은 정렬과 무관하게 항상 맨 앞에 고정됩니다.
  post_filter_sort: "asc"

  # ── (선택) 칩 순서를 직접 정하고 싶을 때만 아래 주석을 풀고 나열하세요. ──
  #   이 목록이 있으면 위 post_filter_sort 대신 이 순서를 그대로 씁니다.
  #   평소엔 그냥 주석 처리해 두면 됩니다.
  # post_filter_order:
  #   - "클라우드 기초"
  #   - "IaC"

sidebar:
  # ── 왼쪽 메뉴 Posts 트리의 대분류(클라우드 기초, IaC 등) 정렬 ──
  #   asc = 영문 대문자 → 영문 소문자 → 한글 (기본)  |  desc = 그 반대
  major_sort: "asc"

  # ── (선택) 대분류 순서를 직접 정하고 싶을 때만 아래 주석을 풀고 나열하세요. ──
  #   목록에 없는 대분류는 자동 정렬로 뒤에 이어붙습니다(새 카테고리 누락 방지).
  # major_order:
  #   - "클라우드 기초"
  #   - "IaC"

  # ── 대분류 아래 중분류(Azure, Linux 등) 정렬 (모든 대분류 공통 적용) ──
  minor_sort: "asc"

  # (선택) 중분류 순서를 직접 정하고 싶을 때만 사용
  # minor_order:
  #   - "인프라 실습"
  #   - "Linux"

defaults:              # (시스템) 글 기본값 — 건드리지 마세요.
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: nodoff365
