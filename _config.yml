title: Notes by nodoff
description: "클라우드 · 인프라 · 보안을 공부하고 기록합니다"
baseurl: ""
url: "https://nodoff365.github.io"
markdown: kramdown
timezone: Asia/Seoul
paginate: 5
paginate_path: "/page:num/"
permalink: /:categories/:title/

kramdown:
  input: GFM
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

author:
  name: nodoff365

github_username: nodoff365
repository: nodoff365/nodoff365.github.io
theme_color: "#111111"

goatcounter:
  script: "https://nodoff365.goatcounter.com/count"
  api: "https://nodoff365.goatcounter.com/counter/"

giscus:
  repo: "nodoff365/nodoff365.github.io"
  repo_id: "R_kgDORQ5KlQ"
  category: "Comments"
  category_id: "DIC_kwDORQ5Klc4C24F_"
  mapping: "pathname"
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "1"
  input_position: "top"
  lang: "en"
  theme_light: "light"
  theme_dark: "transparent_dark"

home:
  major_category_order:
    - "클라우드 기초 / 인프라 실습"
    - "보안 / 모의해킹"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: nodoff365
