<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    {% include head.html %}
  </head>
  <body>
    {% include topbar.html %}
    <div class="app-layout">
      {% include sidebar.html %}
      <main id="main-content" class="main-content">
        {{ content }}
      </main>
    </div>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <script>
      window.__SITE_CONFIG__ = {
        siteUrl: {{ site.url | jsonify }},
        githubRepo: {{ site.repository | jsonify }},
        goatApi: {{ site.goatcounter.api | jsonify }},
        giscusThemeLight: {{ site.giscus.theme_light | default: "light" | jsonify }},
        giscusThemeDark: {{ site.giscus.theme_dark | default: "noborder_dark" | jsonify }}
      };
      window.__POST_SEARCH__ = [
        {% for post in site.posts %}
          {
            title: {{ post.title | jsonify }},
            url: {{ post.url | relative_url | jsonify }},
            slug: {{ post.slug | jsonify }},
            excerpt: {{ post.excerpt | strip_html | normalize_whitespace | jsonify }},
            content: {{ post.content | strip_html | normalize_whitespace | truncate: 500 | jsonify }},
            categories: {{ post.categories | jsonify }},
            tags: {{ post.tags | jsonify }},
            date: {{ post.date | date: "%Y-%m-%d" | jsonify }}
          }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ];
    </script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
    <script src="{{ '/assets/js/metrics.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  </body>
</html>
